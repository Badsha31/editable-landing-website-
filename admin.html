<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora WEB — Admin</title><link rel="stylesheet" href="admin.css"></head><body><div id="login" class="login"><div class="card"><div class="logo">N<span>W</span></div><h1>Nexora WEB</h1><p>Secure content dashboard</p><form id="loginForm"><input id="password" type="password" placeholder="Admin password" required><button>Sign in</button><small id="loginMsg"></small></form></div></div><div id="app" hidden><aside><div class="brand">NEXORA <b>WEB</b></div><button data-tab="overview">Overview</button><button data-tab="content">Content</button><button data-tab="services">Services</button><button data-tab="leads">Leads</button><button id="logout">Logout</button></aside><main><header><div><span>CONTROL CENTER</span><h1 id="title">Overview</h1></div><button id="save" class="gold">Save changes</button></header><section id="overview" class="panel"><div class="stats"><div><b id="leadCount">0</b><small>Total leads</small></div><div><b>CMS</b><small>Live content API</small></div><div><b>24/7</b><small>Always accessible</small></div></div><div class="card"><h2>Nexora WEB CMS</h2><p>Edit landing content, services and review contact leads.</p></div></section><section id="content" class="panel" hidden><div class="card"><h2>Brand & Hero</h2><label>Brand<input id="brand"></label><label>Tagline<input id="tagline"></label><label>Hero eyebrow<input id="eyebrow"></label><label>Hero title<textarea id="heroTitle"></textarea></label><label>Hero description<textarea id="heroDescription"></textarea></label><label>Email<input id="email"></label><label>WhatsApp<input id="whatsapp"></label></div></section><section id="services" class="panel" hidden><div id="serviceList"></div><button id="addService">+ Add service</button></section><section id="leads" class="panel" hidden><div class="card"><h2>Contact leads</h2><div id="leadsList"></div></div></section></main></div><script src="admin.js"></script></body></html>
